name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deploy by hand (Actions -> CI -> Run workflow, or `gh workflow run ci.yml
  # --ref main`): the whole pipeline runs and the deploy job goes ahead even
  # while DEPLOY_PAUSED is set - that is how a paused series of merges reaches
  # the server in one go at the end. "force" redoes steps deploy.sh would
  # otherwise skip as unchanged (docs/deployment.md).
  workflow_dispatch:
    inputs:
      force:
        description: "Schritte trotzdem ausführen (deploy.sh DEPLOY_FORCE)"
        type: choice
        default: none
        options: [none, all, install, register, pm2, node, build]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # Runtime dependencies only: a dev tool never reaches the server.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # With coverage, so the thresholds in jest.config.js are enforced here.
      - name: Run tests with coverage
        run: npm run test:coverage

  # The React client used to be built only on the production server
  # (deploy.sh), so a type error surfaced after the merge. It is linted,
  # type-checked and built here before anything is deployed (#414).
  web-client:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web-client

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: src/web-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A few client tests hold a client module against its backend twin
      # (src/web-client/src/test/backend.ts loads it with Node's require), so
      # the backend's runtime dependencies (axios, luxon, ...) must be there.
      - name: Install backend dependencies
        working-directory: .
        run: npm ci --omit=dev --ignore-scripts

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      # A ratchet: 18 warnings today (17 react-refresh/only-export-components,
      # 1 react-hooks/exhaustive-deps). A new one fails the job; lower the
      # number whenever one is fixed, down to 0.
      - name: Run ESLint
        run: npm run lint -- --max-warnings=18

      # Colours only as design variables (#441): no hex or rgb()/rgba() outside
      # src/styles/tokens.css (.stylelintrc.json).
      - name: Run Stylelint
        run: npm run lint:css

      # The client's own tests (Vitest + jsdom, #435).
      - name: Test
        run: npm test

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build

      # The deploy job ships exactly this build to the server: there, tsc +
      # vite took minutes of swapping on 1 vCPU and 921 MB RAM. Same run, same
      # commit - also for a manual run (workflow_dispatch).
      - name: Keep the build for the deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: web-client-dist
          path: src/web-client/dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test, web-client]
    # Every merge to main deploys - unless the repository variable
    # DEPLOY_PAUSED is "1" (Settings -> Secrets and variables -> Actions ->
    # Variables, or `gh variable set DEPLOY_PAUSED --body 1`). While it is
    # set, merges only lint, test and build; a manual run (workflow_dispatch)
    # still deploys. Used when many PRs land in a row, so the server gets one
    # deploy at the end instead of one per merge.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && vars.DEPLOY_PAUSED != '1'))

    # Deploys queue up instead of running side by side. Three merges within
    # eight minutes (#472, #473, #475) each ran `git reset` + `npm ci` on the
    # server while another one was restarting pm2: the bot crash-looped and
    # every healthcheck timed out. A running deploy is never cancelled. GitHub
    # keeps at most ONE deploy waiting behind it: a newer one that queues up
    # replaces the waiting one (shown as "cancelled") - fine, the newer commit
    # contains the older. Each deploy puts its own commit live (DEPLOY_SHA, the
    # one its client was built from); one that gets its turn after a newer
    # commit is already live does nothing (deploy.sh, DEPLOYED_COMMIT).
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    # Which directory the checkout lives in on the server. A repository variable
    # (Settings -> Secrets and variables -> Actions -> Variables) wins, so the
    # path can be corrected without touching this file. The default is the one
    # deploy.sh has always used.
    env:
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/var/www/pulsebot' }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_FORCE: ${{ inputs.force != 'none' && inputs.force || '' }}

    steps:
      # Eight merges in a row deployed nothing: the ssh action wrote "missing
      # server host" and the job went green anyway (#314). A missing secret now
      # fails the job with a sentence that says what to enter where.
      - name: Secrets prüfen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Deploy-Secret fehlt::${name} fehlt — in Settings → Secrets and variables → Actions → Repository secrets eintragen (siehe docs/deployment.md)."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Ohne diese Secrets kann nicht deployt werden. Der Job bricht ab, damit ein fehlgeschlagenes Deployment nicht als Erfolg durchgeht."
            exit 1
          fi
          # The path goes into remote shell commands below, quoted with '...'.
          if [[ ! "$DEPLOY_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error title=DEPLOY_DIR ungültig::DEPLOY_DIR muss ein absoluter Pfad aus Buchstaben, Ziffern und ._/- sein (ist: $DEPLOY_DIR)."
            exit 1
          fi
          echo "Alle Deploy-Secrets sind gesetzt. Zielverzeichnis: $DEPLOY_DIR"

      - name: Download the web client build
        uses: actions/download-artifact@v8
        with:
          name: web-client-dist
          path: web-client-dist

      # Into a staging directory inside the checkout (.deploy/dist-<sha>),
      # under a .part name until it is complete; deploy.sh switches it in.
      # tar over plain ssh: neither side needs rsync.
      - name: Copy the build to the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          test -f web-client-dist/index.html
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          target="$DEPLOY_DIR/.deploy/dist-$DEPLOY_SHA"
          tar -C web-client-dist -czf - . | ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "$SSH_USER@$SSH_HOST" \
            "set -e; [ -d '$DEPLOY_DIR/.git' ] || { echo 'Kein git-Checkout unter $DEPLOY_DIR - DEPLOY_DIR prüfen (docs/deployment.md).'; exit 1; }; rm -rf '$target.part'; mkdir -p '$target.part'; tar -xzf - -C '$target.part'; rm -rf '$target'; mv '$target.part' '$target'"
          rm -f ~/.ssh/deploy_key
          echo "Client-Build liegt auf dem Server unter $target ($(du -sh web-client-dist | cut -f1))."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Optional — 22 unless the server listens elsewhere.
          port: ${{ secrets.SSH_PORT || 22 }}
          # The action's default (10 min) once cut the script off in the middle
          # of the web client build, which took 4-5 min on the server. With the
          # build from CI a deploy takes about a minute; the margin stays for
          # DEPLOY_FORCE=build, which builds on the server again.
          command_timeout: 20m
          envs: DEPLOY_DIR,DEPLOY_SHA,DEPLOY_FORCE
          # deploy.sh comes from the commit being deployed, not from the
          # checkout the server still has: a change to the script works on the
          # very deploy that brings it.
          script: |
            set -e
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Verzeichnis $DEPLOY_DIR gibt es auf dem Server nicht — DEPLOY_DIR als Repository-Variable setzen (siehe docs/deployment.md)."
              exit 1
            fi
            cd "$DEPLOY_DIR"
            git fetch --quiet origin
            mkdir -p .deploy
            git show "$DEPLOY_SHA:deploy.sh" > ".deploy/deploy-$DEPLOY_SHA.sh"
            PREBUILT_DIST="$DEPLOY_DIR/.deploy/dist-$DEPLOY_SHA" bash ".deploy/deploy-$DEPLOY_SHA.sh" main
